symbols:
  - name: LogEntry
    intent: "Immutable data class representing one parsed log line with timestamp, level, and message."
    relations: []
  - name: LogAnalyzer
    intent: "Parses structured log files and provides level-based filtering and frequency aggregation."
    relations:
      - "log-parse-error"
  - name: LogAnalyzer.parse
    intent: >
      Reads the log file line by line and extracts entries that match the expected
      timestamp/level/message pattern. Silently skips malformed lines (see ISSUE-101).
    relations:
      - "log-parse-error"
  - name: LogAnalyzer.count_by_level
    intent: "Returns a {level: count} frequency dict. Level case is preserved as-is in the original log."
    relations: []
  - name: LogAnalyzer.filter_by_level
    intent: "Returns all log entries whose level matches the given string (comparison is case-insensitive)."
    relations: []
